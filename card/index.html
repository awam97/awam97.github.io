<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>awam QR card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: crisp, confident, minimal — a card you hand over
   IDEA: a printed business card sitting on a desk
   PICTURE: the card itself, one QR code as its face
   COLOUR and TYPE: brand plum #77206e ground, deep plum panel, white card, ink QR; Figtree
   LAYOUT: one centred card, QR beside the logo panel, stack on phones */
:root{color-scheme:light dark;--bg:light-dark(#77206e,#1f0a1d);--card:#fff;--ink:#1f0a1d;--muted:#6b5a68;--accent:#77206e;--panel:#4e1448}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip;display:grid;place-items:center;padding:clamp(20px,5vw,56px) 16px}
.wrap{width:min(860px,100%);display:grid;gap:20px;justify-items:center}
.card{width:100%;aspect-ratio:1.75/1;background:var(--card);border-radius:18px;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 30px 60px -20px rgba(0,0,0,.45),0 8px 18px rgba(0,0,0,.18);display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.6fr);overflow:hidden;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px) rotate(-1deg)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.brand{background:linear-gradient(160deg,var(--accent),var(--panel));color:#fff;padding:clamp(20px,4vw,40px);display:flex;flex-direction:column;justify-content:space-between;position:relative}
.brand::after{content:"";position:absolute;right:-60px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.logo{display:block;width:100%;max-width:260px;height:auto;position:relative;z-index:1}
.tag{font-size:15px;opacity:.85;max-width:16ch}
.codes{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;padding:clamp(12px,2.5vw,24px);align-items:center}
.code{display:grid;gap:6px;justify-items:center;text-align:center;color:var(--ink);text-decoration:none;border-radius:12px;padding:8px}
.code:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.qr{width:100%;max-width:360px;aspect-ratio:1;display:block}
.qr svg{width:100%;height:100%;display:block}
.label{font-weight:600;font-size:13px;color:var(--muted)}
.url{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.code:hover .url{color:var(--accent)}
.err{font-size:13px;color:var(--muted);display:grid;place-items:center;height:100%;border:1px dashed #ccc;border-radius:8px;padding:8px}
.note{color:#fff;opacity:.8;font-size:14px;text-align:center}
@media(max-width:600px){
  .card{aspect-ratio:auto;grid-template-columns:1fr}
  .brand{gap:18px}
  .logo{max-width:220px}
}
@media(max-width:600px){.qr{max-width:320px}}
@media print{body{background:#fff}.note{display:none}.card{box-shadow:none;border:1px solid #ddd}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
