name: Build pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/build.mjs']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node scripts/build.mjs
      - name: Commit built pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html en/index.html
          git diff --cached --quiet || (git commit -m "Build pages from src/page.html" && git push)
