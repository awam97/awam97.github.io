name: tmp fetch awam.ly images
on:
  push:
    branches: [tmp-fetch-awamly]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p fetched/images
          for f in favicon.ico apple-touch-icon.png images/favicon.ico images/logo-color.png images/logo-white.png images/awam.jpg images/og-default.png; do
            curl -fsSL "https://awam.ly/$f" -o "fetched/$f"
          done
          file fetched/* fetched/images/*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fetched && git commit -m "fetched" && git push
